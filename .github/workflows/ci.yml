name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build (generates gRPC/protobuf sources from proto/)
        run: ./gradlew build --stacktrace

      - name: Run order-service integration tests
        run: ./gradlew :order-service:test --tests "com.example.orderservice.OrderPaymentStatusIntegrationTest" --stacktrace

      - name: Publish test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            order-service/build/reports/tests
            payment-service/build/reports/tests
