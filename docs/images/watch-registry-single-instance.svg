<svg width="680" height="300" viewBox="0 0 680 300" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" role="img">
<title>An in-memory watch registry is per-instance state</title>
<desc>An admin PATCH request lands on one of two payment-service instances behind a load balancer. That instance's in-memory watch registry pushes the update to watcher A, who is connected to that same instance. Watcher B, connected to the other instance, never receives the update, because each instance keeps its own separate registry in memory. This is the design problem that led to replacing the registry with a caller-driven poll loop.</desc>
<rect x="0" y="0" width="680" height="300" fill="#FFFFFF"/>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="#4B5563" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>
<text x="180" y="60" text-anchor="middle" font-size="14" font-weight="500" fill="#111827">admin PATCH</text>
<line x1="180" y1="72" x2="180" y2="135" stroke="#4B5563" stroke-width="1.5" marker-end="url(#arrow)"/>
<g>
<rect x="40" y="140" width="280" height="110" rx="8" fill="#DBEAFE" stroke="#3B82F6" stroke-width="1.5"/>
<text x="180" y="170" text-anchor="middle" font-size="14" font-weight="500" fill="#1E3A8A">payment-service #1</text>
<text x="180" y="192" text-anchor="middle" font-size="12" fill="#1D4ED8">own watch registry</text>
<text x="180" y="214" text-anchor="middle" font-size="12" fill="#1D4ED8">&#8594; watcher A gets it</text>
</g>
<g>
<rect x="360" y="140" width="280" height="110" rx="8" fill="#FEE2E2" stroke="#EF4444" stroke-width="1.5"/>
<text x="500" y="170" text-anchor="middle" font-size="14" font-weight="500" fill="#7F1D1D">payment-service #2</text>
<text x="500" y="192" text-anchor="middle" font-size="12" fill="#B91C1C">own watch registry</text>
<text x="500" y="214" text-anchor="middle" font-size="12" fill="#B91C1C">watcher B: nothing</text>
</g>
<text x="340" y="280" text-anchor="middle" font-size="12" fill="#6B7280">Each instance's registry is private, in-process state</text>
</svg>
