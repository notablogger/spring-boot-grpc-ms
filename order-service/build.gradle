plugins {
    id 'java'
    id 'org.springframework.boot'
    id 'com.google.protobuf'
}

description = 'REST API that lets clients check payment status for an order, backed by a gRPC call to payment-service'

ext {
    grpcVersion = '1.65.1'
    protobufVersion = '3.25.3'
    grpcSpringBootStarterVersion = '3.1.0.RELEASE'
}

dependencies {
    // Spring Web starter provides REST support (embedded Tomcat + Spring MVC)
    implementation 'org.springframework.boot:spring-boot-starter-web'
    // gRPC client starter integrates net.devh gRPC client with Spring Boot
    implementation "net.devh:grpc-client-spring-boot-starter:${grpcSpringBootStarterVersion}"

    // Protobuf-generated message classes used at runtime
    implementation "io.grpc:grpc-protobuf:${grpcVersion}"
    // gRPC stub APIs used by client code to invoke RPCs
    implementation "io.grpc:grpc-stub:${grpcVersion}"
    // Netty transport (shaded) for gRPC network layer at runtime
    runtimeOnly "io.grpc:grpc-netty-shaded:${grpcVersion}"
    // Annotations API required at compile time (provided)
    compileOnly 'org.apache.tomcat:annotations-api:6.0.53'

    // Spring test utilities
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    // In-process gRPC test utilities for fast integration tests without a real server
    testImplementation "io.grpc:grpc-inprocess:${grpcVersion}"
}

sourceSets {
    main {
        proto {
            srcDir '../proto'
        }
    }
}

protobuf {
    // Protobuf compiler (protoc) artifact used to generate Java sources from .proto files
    protoc {
        artifact = "com.google.protobuf:protoc:${protobufVersion}"
    }
    plugins {
        // gRPC plugin for protoc that generates gRPC Java code (services and stubs)
        grpc {
            artifact = "io.grpc:protoc-gen-grpc-java:${grpcVersion}"
        }
    }
    generateProtoTasks {
        // Configure all proto generation tasks to run the grpc plugin so both
        // protobuf message classes and gRPC stubs are generated into the
        // project's source set.
        all().each { task ->
            task.plugins {
                grpc {}
            }
        }
    }
}
