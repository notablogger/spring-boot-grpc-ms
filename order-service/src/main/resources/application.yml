server:
  port: 8080

spring:
  application:
    name: order-service
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8081/realms/spring-grpc}
  grpc:
    client:
      channel:
        paymentService:
          target: static://localhost:9090

logging:
  level:
    com.example.orderservice: INFO
    org.springframework.grpc: INFO
