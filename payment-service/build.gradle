plugins {
    id 'java'
    id 'org.springframework.boot'
    id 'com.google.protobuf'
}

description = 'gRPC server exposing payment status lookups for orders'

ext {
    // These match Spring Boot 4.1's managed versions (io.grpc:* and
    // com.google.protobuf:*) -- kept explicit here only because the
    // protobuf-gradle-plugin's codegen-tool coordinates (below) aren't
    // covered by io.spring.dependency-management, which only manages the
    // dependencies {} block.
    grpcVersion = '1.80.0'
    protobufVersion = '4.34.2'
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-grpc-server'
    // JWT decoding/validation support used to verify tokens issued by Keycloak.
    implementation 'org.springframework.boot:spring-boot-starter-oauth2-resource-server'

    implementation 'com.fasterxml.jackson.core:jackson-databind'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    // Not pulled in transitively by the starter; version managed by the
    // Spring Boot BOM via io.spring.dependency-management.
    testImplementation 'io.grpc:grpc-inprocess'
}

sourceSets {
    main {
        proto {
            srcDir '../proto'
        }
    }
}

protobuf {
    protoc {
        artifact = "com.google.protobuf:protoc:${protobufVersion}"
    }
    plugins {
        grpc {
            artifact = "io.grpc:protoc-gen-grpc-java:${grpcVersion}"
        }
    }
    generateProtoTasks {
        all().each { task ->
            task.plugins {
                grpc {}
            }
        }
    }
}
